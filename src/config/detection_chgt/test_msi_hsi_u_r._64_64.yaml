# ============================================================================
# PARAMÈTRES AVANCÉS
# ============================================================================
advanced:
  seed: 42
  deterministic: true
  device: "cuda"             # "cuda" ou "cpu"
  fp32: false                # Force float32 (vs float16 en AMP)
  log_level: "INFO"
  
  # Inférence
  inference:
    verbose: true
    save_intermediate: false # Sauvegarder rec/unc/scores séparément
    
  # Post-processing
  postprocessing:
    apply_morphology: false  # Optionnel: nettoyage morphologique
    threshold_score: null    # Optionnel: binariser au-dessus d'un seuil
    
  # Memory
  memory:
    clear_cache_between_scenes: true
    preload_dataset: false

# ============================================================================
# NOTES SUR LES CONFIGURATIONS
# ============================================================================
# 
# ✅ Modèle Reconstruction:
#    - Entraîné sur dataset "filtered_clean_normalised"
#    - Loss combinée: SAM (0.5) + MAE (1.0)
#    - Activation: SiLU (Swish)
#    - LR: 2e-4
#
# ✅ Modèle Uncertainty:
#    - Loss: Laplace NLL (aleatoric uncertainty)
#    - Sortie: 31 canaux (pas 195!)
#    - Activation finale: Softplus
#    - LR: 3e-4
#
# ✅ Modèle Siamois:
#    - Hétérogène: encodeurs séparés pour MSI vs HSI
#    - Loss: InfoNCE pixel-wise
#    - Masques ternaires: +1 (pas changement), -1 (changement), 0 (incertain)
#    - LR: 1e-5
#    - Entraîné sur paires same-date MSI vs HSI
#
# ⚠️ IMPORTANT:
#    - is_normalised: true → données normalisées pendant inference
#    - is_residual: true → connections résiduelles utilisées
#    - wavelength_filtering: true → bandes atmosphériques retirées
#
# 🔄 Utilisation:
#    python inference_change_detection_clean.py \
#        --config config_inference_production.yaml \
#        --data_dir /mnt/data/MuMuCD_scenes \
#        --output_dir my_results
#
# 💾 Résultats:
#    my_results/
#    ├── aranjuez/change_detection_results.png
#    ├── athens/change_detection_results.png
#    └── ... (une scène par folder)
#