# ============================================================================
# CONFIGURATION POUR INFÉRENCE DE DÉTECTION DE CHANGEMENT
# ============================================================================
# Basée sur les vrais checkpoints et paramètres d'entraînement

# ============================================================================
# DONNÉES
# ============================================================================
data:
  # Dimensions
  n_msi: 12                  # Sentinel-2 (11 bandes + 1)
  n_hsi: 195                 # Prisma (filtré)
  patch_size: 256            # Taille des patchs pour inférence
  
  # Normalisation et traitement
  is_normalised: true        # Les données d'entraînement étaient normalisées
  is_residual: true          # Les modèles utilisent des connexions résiduelles
  
  # Filtrage des bandes atmosphériques
  wavelength_filtering:
    enabled: true
    excluded_windows:
      - [1350, 1500]  # H2O absorption
      - [1800, 2000]  # CO2 absorption
    excluded_bands: []

# ============================================================================
# MODÈLE DE RECONSTRUCTION (MSI → HSI)
# ============================================================================
model:
  name: "GradualExpansionUNet_residual"
  base_channel: 64
  in_msi: 12
  in_hsi: 195
  out_channels: 195
  interpolation_mode: "bilinear"
  activation: "silu"
  with_batch_norm: true
  with_mlp_spectral: false
  final_activation: null
  # Training info:
  # - Loss: SAM-0.5 + MSE-0.0 + MAE-1.0
  # - LR: 0.0002
  # - Filtered clean normalized dataset

# ============================================================================
# MODÈLE D'INCERTITUDE (Confiance de reconstruction)
# ============================================================================
model_uncertainty:
  name: "DualBranchNAFNet"
  base_channel: 64
  n_msi: 12
  n_hsi: 195
  out_channels: 31           # Incertitude: 31 canaux (pas 195!)
  width: 64
  middle_blk_num: 1
  enc_blk_nums: []
  dec_blk_nums: []
  drop_out_rate: 0.0
  final_activation: "softplus"
  # Training info:
  # - Loss: Laplace NLL
  # - LR: 0.0003
  # - Normalised dataset

# ============================================================================
# MODÈLE SIAMOIS (Détection de changement contrastif)
# ============================================================================
model_siamese:
  name: "SiameseNetwork_heterogene"
  in_channel_msi: 12
  in_channel_hsi: 195
  base_channels: 32
  latent_dim: 64
  # Training info:
  # - Loss: InfoNCE pixel-wise avec masques ternaires
  # - LR: 1e-5
  # - Dataset: contrastif same-date MSI vs HSI
  # - Date: 2026-09-22

# ============================================================================
# CHEMINS DES POIDS (VRAIES PATHS)
# ============================================================================
evaluation:
  # Reconstruction Model
  weights_path_reconstruction: >
    /home/ids/jfguerrero/Multimodal-change-detection-for-remote-sensing-images/
    checkpoints/filtered_clean_normalised/
    gradualexpansionunet_res_real_aug_SAM-0.5_MSE-0.0_MAE-1.0_lr-0.0002_no_mlp_residual_filtered_clean_normalised/
    best_model.pth
  
  # Uncertainty Model
  weights_path_uncertainty: >
    /home/ids/jfguerrero/Multimodal-change-detection-for-remote-sensing-images/
    checkpoints/uncertainty_dualbranchnafnet_run_normalised/
    dualbranchnafnet_ch64_laplace_nll_lr-0.0003_UNCERTAINTY/
    best_model.pth
  
  # Siamese Model
  weights_path_siamese: >
    /home/ids/jfguerrero/Multimodal-change-detection-for-remote-sensing-images/
    checkpoints/contrastive_siamese_msi_hsi_64*64_msi_hsi_ur/
    siamese_heterogene_lr1e-05_20260922_015532/
    best_model.pth
  
  # Inférence settings
  use_amp: true              # Automatic Mixed Precision (GPU)
  batch_size: 1              # Petit batch (per-patch)
  num_workers: 4             # DataLoader workers

# ============================================================================
# VISUALISATION
# ============================================================================
visualization:
  max_samples: 6             # Nombre max de patchs par scène
  dpi: 150                   # Résolution PNG
  cmap_uncertainty: "hot"    # Colormap: noir (confiant) → rouge (incertain)
  cmap_error: "YlOrRd"       # Colormap: jaune → orange → rouge
  cmap_score: "viridis"      # Colormap: bleu → vert → jaune → blanc
  save_npy: false            # Optionnel: sauvegarder arrays numpy

# ============================================================================
# CHEMINS DE DONNÉES
# ============================================================================
paths:
  # Dataset directory (contient les scènes)
  # Format: {dataset_dir}/{scene_name}/{scene_name}-prs.nc (HSI Before)
  #                                   /{scene_name}-s2.nc (MSI After)
  dataset_dir: "/mnt/data/MuMuCD_scenes"
  
  # Output directory (où sauvegarder les résultats)
  output_dir: "results/change_detection_production"

